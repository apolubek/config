git:
  diffRenderers:
    - command: env FORCE_COLOR=3 critique --stdin --theme gruvbox
customCommands:
  # Generate a commit message from the staged diff and save it as lazygit's
  # pending commit draft; then press `c` to review/commit.
  # Backend/model come from machine.env (see machine.env.example).
  - key: <c-g>
    context: files
    description: AI commit message
    loadingText: Generating commit message...
    command: '"$HOME/.config/lazygit/scripts/ai-commit-message.sh"'
