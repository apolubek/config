onboarding = false
[ui]
agent_panel_sort = "priority"

[theme]
name = "gruvbox"
auto_switch = false

[keys]
prefix = "ctrl+space"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Navigate mode (prefix+w): j/k move workspace selection, h/l + J/K move panes
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_down = "shift+j"
navigate_pane_up = "shift+k"
navigate_pane_right = "l"

# Workspaces: prefix+J/K cycle (replaces default swap_pane_down/up)
swap_pane_down = ""
swap_pane_up = ""
next_workspace = "prefix+shift+j"
previous_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"

# Built-in actions win over [[keys.command]]; move them so plugin keys work
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"

# Agent panel: cycle agents vim-style
next_agent = "prefix+ctrl+j"
previous_agent = "prefix+ctrl+k"
focus_agent = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "~/.config/herdr/scripts/nvim-sidebar.sh"
description = "nvim sidebar (remembers width)"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"
